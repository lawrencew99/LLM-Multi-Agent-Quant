[project]
name = "newsalpha"
version = "0.1.0"
description = "News-driven multi-agent quantitative trading system for US equities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NewsAlpha" }]

dependencies = [
    # LLM + Agent
    "anthropic>=0.40.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    # Data
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "yfinance>=0.2.50",
    "finnhub-python>=2.4.20",
    "alpaca-py>=0.30.0",
    # Storage
    "redis>=5.2.0",
    "psycopg[binary]>=3.2.0",
    "duckdb>=1.1.0",
    "qdrant-client>=1.12.0",
    # Models / utils
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
]
backtest = [
    "backtrader>=1.9.78",
    "quantstats>=0.0.62",
]

[project.scripts]
newsalpha = "newsalpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsalpha"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/newsalpha"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
